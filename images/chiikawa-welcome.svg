<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <filter id="soft-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#FFB7C5" flood-opacity="0.35"/>
    </filter>
  </defs>
  <!-- Floating Hearts & Sparkles -->
  <g fill="#FF8DA1">
    <path d="M 35 45 C 35 38 43 35 47 41 C 51 35 59 38 59 45 C 59 53 47 62 47 62 C 47 62 35 53 35 45 Z" opacity="0.85"/>
    <path d="M 155 35 C 155 30 161 28 164 32 C 167 28 173 30 173 35 C 173 42 164 48 164 48 C 164 48 155 42 155 35 Z" opacity="0.8"/>
  </g>
  <g fill="#FDFD96" stroke="#E5C158" stroke-width="1">
    <polygon points="170,80 173,86 179,88 174,92 176,98 170,95 165,98 167,92 162,88 168,86"/>
    <polygon points="30,110 32,114 36,115 33,118 34,122 30,120 27,122 28,118 25,115 29,114"/>
  </g>
  <!-- Shadow -->
  <ellipse cx="100" cy="180" rx="55" ry="12" fill="#F3D5DC" opacity="0.6"/>
  <!-- Ears -->
  <circle cx="62" cy="72" r="18" fill="#FFFDF9" stroke="#5C4033" stroke-width="3.5" filter="url(#soft-glow)"/>
  <circle cx="62" cy="72" r="10" fill="#FFE4E8"/>
  <circle cx="138" cy="72" r="18" fill="#FFFDF9" stroke="#5C4033" stroke-width="3.5" filter="url(#soft-glow)"/>
  <circle cx="138" cy="72" r="10" fill="#FFE4E8"/>
  <!-- Body -->
  <path d="M 50 120 C 45 155 60 175 100 175 C 140 175 155 155 150 120 C 150 95 140 68 100 68 C 60 68 50 95 50 120 Z" 
        fill="#FFFDF9" stroke="#5C4033" stroke-width="3.5"/>
  <!-- Feet -->
  <ellipse cx="78" cy="176" rx="12" ry="8" fill="#FFFDF9" stroke="#5C4033" stroke-width="3.5"/>
  <ellipse cx="122" cy="176" rx="12" ry="8" fill="#FFFDF9" stroke="#5C4033" stroke-width="3.5"/>
  <!-- Left Hand (Resting) -->
  <ellipse cx="48" cy="132" rx="10" ry="8" fill="#FFFDF9" stroke="#5C4033" stroke-width="3.5" transform="rotate(-15 48 132)"/>
  <!-- Right Hand (Waving) -->
  <g transform="rotate(35 150 115)">
    <ellipse cx="152" cy="108" rx="11" ry="9" fill="#FFFDF9" stroke="#5C4033" stroke-width="3.5"/>
  </g>
  <!-- Waving Motion lines -->
  <path d="M 168 100 C 172 105 174 112 172 118" stroke="#FF8DA1" stroke-width="2.5" stroke-linecap="round" fill="none"/>
  <path d="M 175 103 C 179 108 181 114 179 120" stroke="#FF8DA1" stroke-width="2" stroke-linecap="round" fill="none"/>
  <!-- Cheeks (Pink Blush) -->
  <ellipse cx="68" cy="122" rx="11" ry="7" fill="#FFB7C5" opacity="0.8"/>
  <line x1="64" y1="120" x2="67" y2="124" stroke="#FF6B8B" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="69" y1="120" x2="72" y2="124" stroke="#FF6B8B" stroke-width="1.5" stroke-linecap="round"/>
  
  <ellipse cx="132" cy="122" rx="11" ry="7" fill="#FFB7C5" opacity="0.8"/>
  <line x1="128" y1="120" x2="131" y2="124" stroke="#FF6B8B" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="133" y1="120" x2="136" y2="124" stroke="#FF6B8B" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Eyes -->
  <circle cx="78" cy="112" r="6" fill="#3D271D"/>
  <circle cx="76.5" cy="110" r="2.2" fill="#FFFFFF"/>
  <circle cx="79.5" cy="114" r="1.2" fill="#FFFFFF"/>
  
  <circle cx="122" cy="112" r="6" fill="#3D271D"/>
  <circle cx="120.5" cy="110" r="2.2" fill="#FFFFFF"/>
  <circle cx="123.5" cy="114" r="1.2" fill="#FFFFFF"/>
  <!-- Nose & Mouth (Cute Cat-like 'w' smile) -->
  <circle cx="100" cy="116" r="2" fill="#3D271D"/>
  <path d="M 94 122 Q 97 126 100 123 Q 103 126 106 122" fill="none" stroke="#5C4033" stroke-width="2.5" stroke-linecap="round"/>
</svg>
